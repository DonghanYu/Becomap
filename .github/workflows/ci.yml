name: ci-deploy

# 흐름: 테스트 → (배포 브랜치 push 또는 수동 실행 시) GitHub Pages에 읽기 전용 데모 배포
# 데모 주소: https://donghanyu.github.io/Becomap/
# 최초 1회: 저장소 Settings → Pages → Build and deployment → Source를 "GitHub Actions"로 설정

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/becomap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install pandas matplotlib openpyxl
      - name: 시드가 생성기 출력과 같은지 확인
        run: python3 scripts/generate_seed.py && git diff --exit-code supabase/seed.sql
      - run: python3 -m unittest discover -s scripts/tests
      - run: bash scripts/db/local_reset.sh
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "1"

  pages:
    needs: test
    # 배포 브랜치 push 또는 Actions 화면의 수동 실행(Run workflow)에서만 배포
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/awesome-wright-url30z'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/becomap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 합성 데이터 DB 준비(스텁 + 마이그레이션 + 시드)
        run: bash scripts/db/local_reset.sh
      - name: 정적 데모 빌드(집계 뷰를 anon 권한으로 읽어 페이지 생성)
        run: bash scripts/build_static.sh
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - name: 정적 데모 E2E
        run: |
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.static.config.ts
        env:
          CI: "1"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out-static
      - id: deployment
        uses: actions/deploy-pages@v4
